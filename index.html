<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track your dog's feeding schedule and ensure proper portions and timing.">
  <title>Dog Feeding Tracker</title>
  <!-- Link to Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Link to Normalize CSS -->
  <link rel="stylesheet" href="styles/normalize.css">
  <!-- Your custom CSS file -->
  <link rel="stylesheet" href="styles/style.css">
</head>

<body>
  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">YourLogo</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <button class="btn btn-link" data-bs-toggle="modal" data-bs-target="#loginModal">Login</button>
          </li>
          <!-- Add links to your GitHub profile, source code, etc. -->
          <li class="nav-item">
            <a class="nav-link" href="https://github.com/CoreyBut">GitHub Profile</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Dog Feeding Tracker -->
  <div class="container">
    <h1 class="text-center">Dog Feeding Tracker</h1>
    <p class="text-center">
      Keep track of your dog's feeding schedule to ensure proper portions and timing. Visit
      <a href="https://www.petmd.com/dog/nutrition/are-you-feeding-your-dog-right-amount" target="_blank">PET MD</a> for tips.
    </p>

    <!-- Dog image -->
    <img src="https://www.thelabradorsite.com/wp-content/uploads/2021/05/Black-Lab-German-Shepherd-Mix-LS-tall-683x1024.jpg" alt="Black Lab German Shepherd Mix" class="center-image">


    <!-- Feeding List -->
    <ul id="feedingList" class="list-group">
      <li class="list-item list-group-item">January 26, 2025 - Morning: 1 cup of kibble</li>
      <li class="list-item list-group-item">January 25, 2025 - Evening: 1.5 cups of kibble</li>
    </ul>

    <!-- Feeding Form -->
    <form id="feedingForm">
      <div class="mb-3">
        <label for="feedingDate" class="form-label">Date:</label>
        <input id="feedingDate" type="date" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="feedingTime" class="form-label">Feeding Time:</label>
        <input id="feedingTime" type="text" class="form-control" placeholder="e.g., Morning or Evening" required>
      </div>

      <div class="mb-3">
        <label for="foodAmount" class="form-label">Food Amount:</label>
        <input id="foodAmount" type="text" class="form-control" placeholder="e.g., 1 cup of kibble" required>
      </div>

      <button type="submit" class="btn btn-primary">Save Feeding</button>
    </form>
  </div>

  <!-- Login Modal -->
  <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="loginModalLabel">Login</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="loginForm">
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Export Button -->
  <footer class="bg-dark text-white p-3 mt-4">
    <p>Author: Corey B</p>
    <button id="exportDataBtn" class="btn btn-secondary">Export Data</button>
  </footer>

  <!-- Include Bootstrap and jQuery scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="scripts/script.js"></script>
</body>

</html>
