<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track your dog's feeding schedule and ensure proper portions and timing.">
  <title>Dog Feeding Tracker</title>
  
  <!-- Link to Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">  <!-- Direct reference to the CSS file -->

  

</head>

<body>
  <!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Dog Tracker</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <button class="btn btn-link nav-link" data-bs-toggle="modal" data-bs-target="#loginModal">Login</button>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="https://github.com/CoreyBut" target="_blank">GitHub Profile</a>
        </li>
      </ul>
    </div>
  </div>
</nav>


  <!-- Dog Feeding Tracker -->
  <div class="container mt-4">
    <h1 class="text-center">Dog Feeding Tracker</h1>
    <p class="text-center">Keep track of your dog's feeding schedule and ensure proper portions. Visit <a href="https://www.petmd.com/dog/nutrition/are-you-feeding-your-dog-right-amount" target="_blank">PET MD</a> for tips.</p>

<div class="mb-4">
  <label for="dogImageUpload" class="form-label">Upload a dog image:</label>
  <input type="file" class="form-control" id="dogImageUpload" accept="image/*">
</div>
<div id="userDogGallery" class="row text-center mb-4"></div>

    
<!-- Dog images -->
<div class="row text-center mb-4">
  <div class="col-md-4">
    <img src="images/Black-Lab-German-Shepherd-Mix-LS-tall-683x1024.jpg" alt="Black Lab German Shepherd Mix" class="img-fluid rounded shadow-sm">
  </div>
    <div class="col-md-4">
    <img src="images/IMG_0781.jpg" alt="Puppies" class="img-fluid rounded shadow-sm">
  </div>
  <div class="col-md-4">
    <img src="images/IMG_8399.jpg" alt="Big Bois" class="img-fluid rounded shadow-sm">
  </div>
</div>

<button id="loadSampleBtn" class="btn btn-info mb-3">Load Sample Data</button>

    
  <!-- Feeding List -->
<ul id="feedingList" class="list-group mb-4">
  <!-- New entries will be appended here -->
</ul>

<!-- Form with mb-3 (less space between form elements) -->
<form id="feedingForm">
  <div class="mb-3">
    <label for="feedingDate" class="form-label">Date:</label>
    <input id="feedingDate" type="date" class="form-control" required>
  </div>

  <div class="mb-3">
    <label for="feedingTime" class="form-label">Feeding Time:</label>
    <input id="feedingTime" type="text" class="form-control" placeholder="e.g., Morning or Evening" required>
  </div>

  <div class="mb-3">
    <label for="foodAmount" class="form-label">Food Amount:</label>
    <input id="foodAmount" type="text" class="form-control" placeholder="e.g., 1 cup of kibble" required>
  </div>

  <button type="submit" class="btn btn-primary">Save Feeding</button>
</form>



<!-- Error Message (hidden by default) -->
<p id="errorMessage" style="color: red; display: none;">Please fill in all fields.</p>


  <!-- Login Modal -->
  <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="loginModalLabel">Login</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="loginForm">
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Export Button -->
  <footer class="bg-dark text-white p-3 mt-4">
    <p>Author: Corey B</p>
    <button id="exportDataBtn" class="btn btn-secondary">Export Data</button>
  </footer>

  <!-- External Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> <!-- External JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Your custom JS -->
  <script src="script.js"></script> <!-- Custom JavaScript -->
</body>

</html>
